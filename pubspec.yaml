name: cuhokhancap
description: "Ứng dụng quản trị cứu hộ khẩn cấp."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_maps_flutter: ^2.18.1
  cloud_functions: ^6.0.0
  cloud_firestore: ^6.10.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  audioplayers: ^6.8.1
  video_player: ^2.14.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
